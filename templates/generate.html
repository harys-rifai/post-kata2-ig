{% extends 'base.html' %}
{% block title %}Generate Content{% endblock %}
{% block breadcrumb %}<span class="current">Generate</span>{% endblock %}
{% block content %}
<div class="content-card">
    <h2>Generate New Content</h2>
    <form id="generate-form" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label style="display: block; margin-bottom: 8px; color: #333; font-weight: 500;">Topic</label>
            <select name="topic" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
                <option value="">-- Select Topic --</option>
                {% for t in topics %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label style="display: block; margin-bottom: 8px; color: #333; font-weight: 500;">Custom Topic (optional)</label>
            <input type="text" name="custom_topic" placeholder="Enter custom topic..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">
        </div>
        <button type="submit" class="btn btn-primary" id="generate-btn">Generate Content</button>
    </form>
    
    <div id="generate-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Generated Content</h3>
                <button type="button" class="close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <h3 id="modal-title"></h3>
                <p id="modal-caption"></p>
                <div id="modal-image-container" style="margin: 15px 0; text-align: center;">
                    <img id="modal-image" style="max-width: 100%; max-height: 300px; border-radius: 8px;" alt="Generated Image">
                </div>
                <div class="modal-footer">
                    <small class="text-muted">Category: <span id="modal-category">-</span></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extrahead %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('generate-form');
    const modal = document.getElementById('generate-modal');
    const closeBtn = document.getElementById('modal-close');
    const modalTitle = document.getElementById('modal-title');
    const modalCaption = document.getElementById('modal-caption');
    const modalImage = document.getElementById('modal-image');
    const modalCategory = document.getElementById('modal-category');
    const modalImageContainer = document.getElementById('modal-image-container');
    
    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('generate-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Generating...';
            btn.disabled = true;
            
            try {
                const formData = new FormData(form);
                const response = await fetch('/generate/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                        'Accept': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    modalTitle.textContent = data.title || 'Generated Content';
                    modalCaption.textContent = data.caption || 'No caption available';
                    
                    // Update category
                    const category = data.category || data.topic || '-';
                    modalCategory.textContent = category.toUpperCase();
                    
                    // Show image if exists
                    if (data.has_image) {
                        // We need to get the actual image URL from the post
                        // For now, we'll show a placeholder or we could make another call
                        modalImageContainer.innerHTML = '<div style="width:100%; height:200px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; color:#666;">Image Generated</div>';
                    } else {
                        modalImageContainer.innerHTML = '<div style="width:100%; height:200px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; color:#666;">No Image</div>';
                    }
                    
                    modal.style.display = 'block';
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('Generate failed: ' + err.message);
            }
            
            btn.textContent = originalText;
            btn.disabled = false;
        });
    }
    
    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
    }
    
    window.addEventListener('click', function(event) {
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
